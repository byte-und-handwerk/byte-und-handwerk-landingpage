name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-actions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build discovery files
        run: python3 scripts/build_content_indexes.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Package website
        run: >-
          tar
          --dereference
          --hard-dereference
          --directory .
          -cf "${RUNNER_TEMP}/artifact.tar"
          --exclude=.git
          --exclude=.github
          --exclude='.[^/]*'
          .

      - name: Upload website
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Notify IndexNow
        if: github.event_name == 'push'
        continue-on-error: true
        run: >-
          python3 scripts/submit_indexnow.py
          --before "${{ github.event.before }}"
          --after "${{ github.sha }}"
