<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Welche Kassendaten braucht eine Bäckerei?</title>
  <desc id="description">Verkauf, Verfügbarkeit und Ergebnis bilden gemeinsam die Grundlage für Mengenplanung.</desc>
  <rect width="1200" height="630" fill="#172126"/>
  <circle cx="1115" cy="92" r="175" fill="#253239"/>
  <circle cx="1050" cy="530" r="250" fill="#1e2b31"/>
  <rect x="72" y="60" width="1056" height="510" rx="34" fill="#f6f2e9"/>
  <rect x="72" y="60" width="18" height="510" rx="9" fill="#b95f43"/>
  <text x="132" y="125" fill="#93472f" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="2">KASSENDATEN · MENGENPLANUNG</text>
  <text x="132" y="205" fill="#172126" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="750">Welche Daten braucht</text>
  <text x="132" y="270" fill="#172126" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="750">eine Bäckerei wirklich?</text>
  <g transform="translate(132 330)">
    <rect width="280" height="132" rx="22" fill="#fffdf9" stroke="#d7a64a" stroke-width="3"/>
    <text x="28" y="48" fill="#93472f" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">01 · VERKAUF</text>
    <text x="28" y="88" fill="#172126" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Artikel + Menge</text>
  </g>
  <g transform="translate(430 330)">
    <rect width="280" height="132" rx="22" fill="#fffdf9" stroke="#456552" stroke-width="3"/>
    <text x="28" y="48" fill="#456552" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">02 · VERFÜGBAR</text>
    <text x="28" y="88" fill="#172126" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Bestand + Zeit</text>
  </g>
  <g transform="translate(728 330)">
    <rect width="330" height="132" rx="22" fill="#fffdf9" stroke="#b95f43" stroke-width="3"/>
    <text x="28" y="48" fill="#93472f" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">03 · ERGEBNIS</text>
    <text x="28" y="88" fill="#172126" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Retoure + Ausverkauf</text>
  </g>
  <text x="132" y="530" fill="#456552" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">byte &amp; Handwerk</text>
  <text x="1058" y="530" fill="#172126" font-family="Arial, Helvetica, sans-serif" font-size="22" text-anchor="end">byteundhandwerk.de</text>
</svg>
